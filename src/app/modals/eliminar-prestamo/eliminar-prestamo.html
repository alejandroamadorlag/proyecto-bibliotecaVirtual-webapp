<div class="confirm-modal">
  <span class="warning-icon"><i class="bi bi-exclamation-triangle"></i></span>

  <h2>¿Eliminar préstamo?</h2>
  <p>Este registro de préstamo se eliminará del sistema.</p>

  <div class="confirm-actions">
    <button class="btn btn-cancelar" (click)="cerrar()">Cancelar</button>
    <button class="btn btn-eliminar" (click)="eliminar()">Eliminar</button>
  </div>
</div>
