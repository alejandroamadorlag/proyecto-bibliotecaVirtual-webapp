<div class="confirm-modal">
  <span class="warning-icon"><i class="bi bi-exclamation-triangle"></i></span>

  <h2>¿Eliminar género?</h2>
  <p>El género dejará de aparecer en el sistema. Esta acción se puede revertir más adelante contactando a un desarrollador.</p>

  <div class="confirm-actions">
    <button class="btn btn-cancelar" (click)="cerrar()">Cancelar</button>
    <button class="btn btn-eliminar" (click)="eliminar()">Eliminar</button>
  </div>
</div>
