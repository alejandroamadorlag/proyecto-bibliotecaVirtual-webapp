<section class="login">
  <div class="wrapper">
    <div class="section-left">
      <div class="brand-logo">
        <span class="brand-mark"><i class="bi bi-book"></i></span>
        <span class="brand-name"><strong>Biblioteca</strong><em>Alameda</em></span>
      </div>
    </div>
    <div class="section-right">
      <div class="card">
        <div class="card-body">
          <p class="eyebrow">BIENVENIDO DE NUEVO</p>
          <h3 class="title">Inicia sesión</h3>
          <p class="subtitle">Ingresa tus datos para acceder a Biblioteca Alameda.</p>
          <div class="container-inputs">
            <div class="pt-3 mb-3">
              <input type="email" [(ngModel)]="username" class="form-control" id="email" placeholder="Correo electrónico">
              @if (errors.username) { <div class="invalid-feedback">{{ errors.username }}</div>}
            </div>

            <div class="pt-3 mb-3">
              <div class="input-group input-group-merge">
                <input type="{{type}}" [(ngModel)]="password" id="password" name="password_user" class="form-control pwd" placeholder="Contraseña" (keyup.enter)="login()">
                <div class="input-group-text" id="show-password" data-password="false">
                    @if (type == 'password') { <i class="bi bi-eye-fill" (click)="showPassword()"></i> }
                    @if (type == 'text') { <i class="bi bi-eye-slash-fill" (click)="showPassword()"></i> }
                </div>
              </div>
              @if (errors.password) { <div class="invalid-feedback">{{ errors.password }}</div> }
            </div>

            <div class="d-flex flex-column align-items-center mb-3 w-100" style="text-align: center;">
              <button class="btn btn-primary" type="submit" (click)="login()">Iniciar sesión</button>
              <label class="form-check-label pt-3" for="checkbox-signin" (click)="registrar()">Registrarse</label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
