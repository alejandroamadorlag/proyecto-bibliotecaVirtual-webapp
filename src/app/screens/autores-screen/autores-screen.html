<div class="body-autores">

  <div class="welcome listing-title">
    <div>
      <p class="eyebrow">ADMINISTRACIÓN</p>
      <h1>Autores</h1>
      <p class="subtitle">Consulta y administra los autores del catálogo.</p>
    </div>

      <button class="btn btn--primary" (click)="registrarAutor()">
        <i class="bi bi-plus-lg"></i> Registrar autor
      </button>
  </div>

  <div class="container">
    @if (rol !== 'cliente') {
      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
          </ng-container>

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let element"> {{ element.first_name }} {{ element.last_name }} </td>
          </ng-container>

          <ng-container matColumnDef="nacionalidad">
            <th mat-header-cell *matHeaderCellDef> Nacionalidad </th>
            <td mat-cell *matCellDef="let element"> {{ element.nacionalidad }} </td>
          </ng-container>

          <ng-container matColumnDef="editar">
            <th mat-header-cell *matHeaderCellDef> Actualizar </th>
            <td mat-cell *matCellDef="let element" class="td-editar">
              <i class="bi bi-pencil-square" (click)="goEditar(element.id)"></i>
            </td>
          </ng-container>

          <ng-container matColumnDef="eliminar">
            <th mat-header-cell *matHeaderCellDef> Eliminar </th>
            <td mat-cell *matCellDef="let element" class="td-eliminar">
              <i class="bi bi-trash3-fill" (click)="delete(element.id)"></i>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                       showFirstLastButtons
                       aria-label="Seleccionar página de autores">
        </mat-paginator>
      </div>
    }
  </div>
</div>
